<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển hướng đến đường link</title>

    <script src="Scripts/script.js" defer></script>

        <button type="submit">Submit</button>
    </form>
</body>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chương trình máy tính</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="Scripts/script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <h2>Máy tính đơn giản</h2>
        <div class="field">
            <label>Số thứ nhất:</label>
            <input type="number" id="num1" value="12">
        </div>
        <div class="field">
            <label>Phép tính:</label>
            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
        </div>
        <div class="field">
            <label>Số thứ hai:</label>
            <input type="number" id="num2" value="14">
        </div>
        <div class="btn-group">
            <button id="btnCalculate">Tính kết quả</button>
        </div>
        <div class="result-box">
            Kết quả: <span id="result">-2</span>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Remove items from a dropdown list</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <form>
    <select id="colorSelect">
      <option>Red</option>
      <option>Green</option>
      <option>White</option>
      <option>Black</option>
    </select>
    <button type="button" id="removeBtn">Select and Remove</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
